# This values only used for E2E tests.
fullnameOverride: mlp
nameOverride: mlp

deployment:
  environment: dev
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  encryption:
    key: password

postgresql:
  # The chart's default bitnami/postgresql:11.5.0-debian-9-r84 is no longer on Docker Hub.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 11.22.0
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  persistence:
    enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  replication:
    enabled: false

ingress:
  enabled: true
  class: traefik
  host: mlp.127.0.0.1.nip.io
